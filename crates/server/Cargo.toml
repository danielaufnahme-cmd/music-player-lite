[package]
name = "geonix-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Music Player Lite server: HTTP API, library database, download queue, device sync"

[lib]
name = "geonix_server"
path = "src/lib.rs"

[[bin]]
name = "geonix-server"
path = "src/main.rs"

[dependencies]
geonix-yt = { path = "../yt" }
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "fs", "io-util", "sync", "time", "process", "signal"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tower-http = { version = "0.6.6", default-features = false, features = ["cors", "fs"] }
tokio-stream = { version = "0.1.17", default-features = false, features = ["sync"] }
futures-util.workspace = true
uuid = { version = "1.17", features = ["v4"] }
reqwest.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
dirs.workspace = true
getrandom = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
